<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ÉLAN — Daily Hero 19 (Figma export)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Syne:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; font-family: 'Plus Jakarta Sans', sans-serif; }
  .viewport { overflow: hidden; }
  .stage {
    position: relative;
    width: 1440px;
    height: 810px;
    overflow: hidden;
    transform-origin: top left;
    background: #000;
  }
  .stage img { display: block; }
  a { text-decoration: none; color: inherit; }

  .bg {
    position: absolute;
    left: -51px;
    top: 0;
    width: 1543px;
    height: 865px;
  }
  .bg img { width: 100%; height: 100%; object-fit: cover; }

  .wordmark,
  .wordmark-overlay {
    position: absolute;
    left: 294px;
    top: 179px;
    width: 954px;
    font-family: Syne, sans-serif;
    font-weight: 600;
    font-size: 400px;
    line-height: 0.69;
    letter-spacing: -32px;
    text-transform: uppercase;
    color: #fff;
    text-align: center;
    white-space: nowrap;
    pointer-events: none;
  }
  .wordmark-overlay {
    mix-blend-mode: overlay;
    opacity: 0.4;
    color: transparent;
    -webkit-text-stroke: 1px rgba(255,255,255,0.35);
  }

  .house {
    position: absolute;
    left: 160px;
    top: 247px;
    width: 1175px;
    height: 531px;
    object-fit: contain;
    pointer-events: none;
  }

  .logo {
    position: absolute;
    left: 51px;
    top: 24px;
    width: 52px;
    height: 52px;
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; }

  nav {
    position: absolute;
    left: 1050px;
    top: 40px;
    display: flex;
    gap: 4px;
  }
  nav a {
    padding: 10px 10px;
    border-radius: 999px;
    border: 1px solid #fff;
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: -0.42px;
    line-height: 1;
  }
  nav a.active { background: #fff; color: #000; border-color: #fff; }

  .lede {
    position: absolute;
    left: 60px;
    top: 179px;
    width: 182px;
    color: #fff;
    font-size: 18px;
    letter-spacing: -0.9px;
    line-height: 1.35;
  }

  .headline {
    position: absolute;
    left: 60px;
    top: 609px;
    width: 210px;
    color: #fff;
    font-family: Syne, sans-serif;
    font-weight: 600;
    font-size: 40px;
    line-height: 1;
    letter-spacing: -2px;
    text-transform: uppercase;
  }

  .cta {
    position: absolute;
    left: 647px;
    top: 664px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 4px 4px 12px;
    background: #fff;
    border-radius: 999px;
    color: #000;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.48px;
  }
  .cta .disc {
    width: 31px;
    height: 31px;
    border-radius: 50%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cta .disc img { width: 14px; height: 14px; }

  .stat {
    position: absolute;
    width: 200px;
    padding: 32px;
    border-radius: 20px;
    background: rgba(0,0,0,0.11);
    backdrop-filter: blur(12px);
    color: #fff;
  }
  .stat b {
    display: block;
    font-family: Syne, sans-serif;
    font-weight: 600;
    font-size: 40px;
    letter-spacing: -3.2px;
    text-transform: uppercase;
    line-height: 1;
  }
  .stat span {
    display: block;
    margin-top: 12px;
    font-size: 18px;
  }
  .stat-a { left: 1180px; top: 360px; }
  .stat-b { left: 1121px; top: 492px; }

  .thumbs {
    position: absolute;
    left: 1222px;
    top: 703px;
    display: flex;
  }
  .thumbs img {
    width: 55px;
    height: 55px;
    border-radius: 50%;
    object-fit: cover;
    margin-left: -20px;
    border: 2px solid rgba(255,255,255,0.15);
  }
  .thumbs img:first-child { margin-left: 0; }

  .cta, nav a { transition: transform 0.35s cubic-bezier(0.22,1,0.36,1); }
  .cta:hover { transform: translateY(-3px); }

  @media (prefers-reduced-motion: no-preference) {
    .headline, .lede { animation: fadeUp 1s cubic-bezier(0.22,1,0.36,1) 0.2s both; }
    .cta, .stat, .thumbs { animation: fadeUp 1s cubic-bezier(0.22,1,0.36,1) 0.5s both; }
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="viewport">
  <div class="stage" id="stage">
    <div class="bg"><img src="assets/bg.png" alt=""></div>
    <div class="wordmark">ÉLAN</div>
    <img class="house" src="assets/house.png" alt="">
    <div class="wordmark-overlay">ÉLAN</div>

    <a class="logo" href="#"><img src="assets/logo.png" alt="ÉLAN"></a>
    <nav>
      <a class="active" href="#">Home</a>
      <a href="#">Listings</a>
      <a href="#">About</a>
      <a href="#">Agents</a>
      <a href="#">Contact</a>
    </nav>

    <p class="lede">Discover exclusive properties curated for modern living</p>
    <h1 class="headline">Where luxury finds its address</h1>
    <a class="cta" href="#">
      Consultation
      <span class="disc"><img src="assets/arrow.svg" alt=""></span>
    </a>

    <div class="stat stat-a">
      <b>250+</b>
      <span>Premium Listings</span>
    </div>
    <div class="stat stat-b">
      <b>42</b>
      <span>Global locations</span>
    </div>

    <div class="thumbs">
      <img src="assets/thumb-1.png" alt="">
      <img src="assets/thumb-2.png" alt="">
      <img src="assets/thumb-3.png" alt="">
      <img src="assets/thumb-4.png" alt="">
    </div>
  </div>
</div>
<script>
  (function () {
    var stage = document.getElementById('stage');
    var viewport = stage.parentElement;
    function fit() {
      var width = window.innerWidth || 1440;
      var scale = Math.min(1, width / 1440);
      stage.style.transform = 'scale(' + scale + ')';
      viewport.style.height = (810 * scale) + 'px';
    }
    window.addEventListener('resize', fit);
    fit();
  })();
</script>
</body>
</html>
