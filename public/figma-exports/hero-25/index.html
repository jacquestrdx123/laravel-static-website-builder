<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hiroshi — Daily Hero 25 (Figma export)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; font-family: Inter, sans-serif; }
  .viewport { overflow: hidden; }
  .stage {
    position: relative;
    width: 1440px;
    height: 810px;
    overflow: hidden;
    transform-origin: top left;
    background: #f6f8fc;
  }
  .stage img { display: block; }
  a { text-decoration: none; color: inherit; }

  .sun {
    position: absolute;
    left: 82px;
    top: -327px;
    width: 1311px;
    height: 1311px;
    pointer-events: none;
  }
  .title-l, .title-r {
    position: absolute;
    top: 230px;
    font-family: Outfit, sans-serif;
    font-weight: 600;
    font-size: 282px;
    line-height: 0.7;
    letter-spacing: -11.27px;
    text-transform: uppercase;
    color: #4e405f;
    white-space: nowrap;
  }
  .title-l { left: -4px; }
  .title-r { right: -14px; }

  .kanji {
    position: absolute;
    right: 0;
    top: 136px;
    width: 146px;
    font-family: Outfit, sans-serif;
    font-weight: 600;
    font-size: 191px;
    line-height: 0.95;
    letter-spacing: -7.64px;
    text-transform: uppercase;
    text-align: center;
    color: transparent;
    -webkit-text-stroke: 1px rgba(78,64,95,0.18);
    writing-mode: vertical-rl;
  }

  .flowers {
    position: absolute;
    left: 0;
    top: 437px;
    width: 1440px;
    height: 375px;
    object-fit: cover;
    object-position: bottom;
    pointer-events: none;
  }
  .samurai {
    position: absolute;
    left: 454px;
    top: 181px;
    width: 437px;
    height: 494px;
    object-fit: contain;
    pointer-events: none;
  }
  .caption {
    position: absolute;
    left: 50%;
    top: 518px;
    transform: translateX(-50%);
    width: 65px;
    color: #fff;
    font-family: Outfit, sans-serif;
    font-weight: 600;
    font-size: 20px;
    letter-spacing: -0.8px;
    text-transform: uppercase;
    text-align: center;
    line-height: 1.15;
  }

  .petal {
    position: absolute;
    pointer-events: none;
  }
  .petal.a { left: 341px; top: 488px; width: 18px; height: 18px; transform: rotate(-71.74deg); }
  .petal.b { left: 162px; top: 434px; width: 31px; height: 31px; transform: rotate(131deg) scaleY(-1); }
  .petal.c { left: 1270px; top: 77px; width: 209px; height: 248px; transform: rotate(-172deg) scaleY(-1); filter: blur(10px); }
  .petal.d { left: 354px; top: 478px; width: 265px; height: 264px; transform: rotate(-148deg) scaleY(-1); filter: blur(11px); }

  .logo {
    position: absolute;
    left: 24px;
    top: 14px;
    width: 33px;
    height: 36px;
    background: #4e405f;
    -webkit-mask: url(assets/logo-mask.png) center / contain no-repeat;
    mask: url(assets/logo-mask.png) center / contain no-repeat;
  }
  nav {
    position: absolute;
    left: 50%;
    top: 19px;
    transform: translateX(-50%);
    display: flex;
    gap: 29px;
    align-items: center;
  }
  nav a {
    padding: 9px 13px;
    border-radius: 999px;
    font-size: 12px;
    letter-spacing: -0.12px;
    color: #463c52;
  }
  nav a.on { background: #fff; }
  .menu {
    position: absolute;
    right: 24px;
    top: 26px;
    width: 44px;
    height: 12px;
  }
  .menu img { width: 100%; height: 100%; }

  .social {
    position: absolute;
    left: 24px;
    top: 574px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .social a {
    width: 40px;
    height: 40px;
    border: 1px solid #fff;
    border-radius: 99px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .social a img { position: absolute; width: 20px; height: 20px; }

  .story {
    position: absolute;
    left: 1018px;
    top: 465px;
    width: 309px;
  }
  .story img {
    position: absolute;
    left: 0;
    top: 0;
    width: 77px;
    height: 124px;
    border-radius: 7px;
    object-fit: cover;
  }
  .story h3 {
    margin-left: 98px;
    font-family: Outfit, sans-serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: -0.72px;
    text-transform: uppercase;
    color: #463c52;
  }
  .story p {
    margin: 17px 0 0 98px;
    width: 211px;
    font-size: 14px;
    line-height: 1.4;
    letter-spacing: -0.14px;
    color: #463c52;
  }

  .card {
    position: absolute;
    left: 191px;
    top: 534px;
    width: 196px;
    height: 252px;
  }
  .card .shape { position: absolute; inset: 0; width: 100%; height: 100%; }
  .card .pic {
    position: absolute;
    left: 33px;
    top: 4px;
    width: 127px;
    height: 123px;
    border-radius: 7px;
    object-fit: cover;
  }
  .card .jp {
    position: absolute;
    left: 11px;
    top: 96px;
    width: 10px;
    color: #ffab85;
    font-family: Outfit, sans-serif;
    font-weight: 600;
    font-size: 10px;
    letter-spacing: -0.4px;
    text-transform: uppercase;
    line-height: 1;
    text-align: center;
  }
  .card h3 {
    position: absolute;
    left: 16px;
    top: 159px;
    width: 125px;
    font-family: Outfit, sans-serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: -0.72px;
    text-transform: uppercase;
    color: #463c52;
  }
  .card .go {
    position: absolute;
    right: 13px;
    bottom: 13px;
    width: 32px;
    height: 32px;
  }
  .card .go img { position: absolute; width: 16px; height: 16px; left: 8px; top: 8px; }

  .cta {
    position: absolute;
    left: 50%;
    top: 708px;
    transform: translateX(-50%);
    display: flex;
    align-items: stretch;
  }
  .cta .lab {
    padding: 32px;
    background: #fff;
    border-radius: 12px;
    font-family: Outfit, sans-serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: -0.72px;
    text-transform: uppercase;
    color: #463c52;
  }
  .cta .arr {
    width: 80px;
    background: #ffab85;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cta .arr img { width: 32px; height: 32px; }

  .scroll {
    position: absolute;
    left: 1249px;
    top: 641px;
    width: 194px;
    height: 194px;
  }
  .scroll img { position: absolute; }
  .scroll .e1 { inset: 0; width: 194px; height: 194px; }
  .scroll .e2 { left: 28px; top: 28px; width: 138px; height: 138px; }
  .scroll .e3 { left: 54px; top: 54px; width: 85px; height: 85px; }
  .scroll .dn { left: 81px; top: 81px; width: 32px; height: 32px; }

  .cta, .card .go { transition: transform 0.35s cubic-bezier(0.22,1,0.36,1); }
  .cta:hover { transform: translateX(-50%) translateY(-3px); }

  @media (prefers-reduced-motion: no-preference) {
    .title-l, .title-r { animation: fadeUp 1.1s cubic-bezier(0.22,1,0.36,1) 0.15s both; }
    .samurai { animation: fadeUp 1.2s cubic-bezier(0.22,1,0.36,1) 0.3s both; }
    .cta, .card, .story { animation: fadeUp 1s cubic-bezier(0.22,1,0.36,1) 0.55s both; }
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="viewport">
  <div class="stage" id="stage">
    <img class="sun" src="assets/sun.svg" alt="">
    <div class="title-l">Hir</div>
    <div class="title-r">shi</div>
    <div class="kanji">沈黙の刃</div>
    <img class="samurai" src="assets/samurai.png" alt="">
    <img class="flowers" src="assets/flowers.png" alt="">
    <p class="caption">静寂に包まれた影の旅人</p>
    <img class="petal a" src="assets/petal.png" alt="">
    <img class="petal b" src="assets/petal-2.png" alt="">
    <img class="petal c" src="assets/petal-2.png" alt="">
    <img class="petal d" src="assets/petal.png" alt="">

    <a class="logo" href="#"></a>
    <nav>
      <a class="on" href="#">home</a>
      <a href="#">archive</a>
      <a href="#">journey</a>
      <a href="#">signals</a>
      <a href="#">legends</a>
      <a href="#">contact</a>
    </nav>
    <a class="menu" href="#"><img src="assets/menu.svg" alt=""></a>

    <div class="social">
      <a href="#"><img src="assets/ig-ring.svg" alt=""><img src="assets/ig-dot.svg" alt="" style="width:6px;height:6px;left:17px;top:10px;"></a>
      <a href="#"><img src="assets/yt-body.svg" alt=""><img src="assets/yt-play.svg" alt=""></a>
      <a href="#"><img src="assets/li-box.svg" alt=""><img src="assets/li-n.svg" alt=""></a>
      <a href="#"><img src="assets/fb-box.svg" alt=""><img src="assets/fb-f.svg" alt=""></a>
    </div>

    <div class="card">
      <img class="shape" src="assets/card-shape.svg" alt="">
      <img class="pic" src="assets/card-horse.png" alt="">
      <div class="jp">風<br>の<br>導<br>き</div>
      <h3>Walking Through Whispers</h3>
      <a class="go" href="#">
        <img src="assets/arrow-ur-line.svg" alt="">
        <img src="assets/arrow-ur-head.svg" alt="">
      </a>
    </div>

    <div class="story">
      <img src="assets/card-story.png" alt="">
      <h3>lonely samurai</h3>
      <p>Hiroshi, a lonely samurai, wanders the quiet forest, seeking purpose and peace.</p>
    </div>

    <a class="cta" href="#">
      <span class="lab">Explore</span>
      <span class="arr"><img src="assets/arrow-head.svg" alt=""></span>
    </a>

    <div class="scroll">
      <img class="e1" src="assets/scroll-1.svg" alt="">
      <img class="e2" src="assets/scroll-2.svg" alt="">
      <img class="e3" src="assets/scroll-3.svg" alt="">
      <img class="dn" src="assets/down-line.svg" alt="">
    </div>
  </div>
</div>
<script>
  (function () {
    var stage = document.getElementById('stage');
    var viewport = stage.parentElement;
    function fit() {
      var width = window.innerWidth || 1440;
      var scale = Math.min(1, width / 1440);
      stage.style.transform = 'scale(' + scale + ')';
      viewport.style.height = (810 * scale) + 'px';
    }
    window.addEventListener('resize', fit);
    fit();
  })();
</script>
</body>
</html>
