<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spatial Computing — Daily Hero 04 (Figma export)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tektur:wght@400;500&family=Urbanist:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; font-family: Urbanist, sans-serif; }
  .viewport { overflow: hidden; }
  .stage {
    position: relative;
    width: 1440px;
    height: 810px;
    overflow: hidden;
    transform-origin: top left;
    background: #303436;
  }
  .stage img { display: block; }
  a { text-decoration: none; color: inherit; }

  .scene {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 1440px;
    height: 809px;
    object-fit: cover;
    pointer-events: none;
  }

  .logo {
    position: absolute;
    left: 24px;
    top: 27px;
    width: 43px;
    height: 23px;
    overflow: hidden;
  }
  .logo img {
    position: absolute;
    width: 227%;
    height: 420%;
    left: -64%;
    top: -160%;
    max-width: none;
  }

  nav {
    position: absolute;
    left: 50%;
    top: 34px;
    transform: translateX(-50%);
    display: flex;
    gap: 60px;
    color: #fff;
    font-size: 12px;
    line-height: 0.9;
    white-space: nowrap;
  }
  nav a { font-weight: 300; }
  nav a.active { font-weight: 500; }

  .preorder {
    position: absolute;
    right: 24px;
    top: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 24px;
    border-radius: 12px;
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    line-height: 0.9;
    background: linear-gradient(73deg, rgba(255,255,255,0.3) 5%, rgba(255,255,255,0.054) 64%);
    backdrop-filter: blur(5px);
  }
  .dots {
    display: grid;
    grid-template-columns: 3px 3px;
    gap: 3px;
    transform: rotate(-90deg);
  }
  .dots i { width: 2.4px; height: 2.4px; background: #fff; display: block; }

  .headline {
    position: absolute;
    left: 24px;
    top: 167px;
    width: 274px;
    color: #fff;
    font-family: Tektur, sans-serif;
    font-size: 60px;
    line-height: 0.9;
    letter-spacing: -0.6px;
    text-transform: uppercase;
    font-feature-settings: "ss01" 1, "ss02" 1, "ss05" 1;
  }
  .headline span { display: block; height: 54px; }

  .aside {
    position: absolute;
    left: 1183px;
    top: 200px;
    width: 231px;
    color: #fff;
  }
  .aside h2 {
    font-family: Tektur, sans-serif;
    font-weight: 500;
    font-size: 32px;
    line-height: 1.25;
    text-transform: uppercase;
  }
  .aside p {
    margin-top: 21px;
    font-size: 20px;
    line-height: 1.3;
  }

  .cards {
    position: absolute;
    left: 396px;
    top: 585px;
    width: 647px;
    height: 211px;
  }
  .card {
    position: absolute;
    width: 168px;
    height: 152px;
    border-radius: 40px;
    overflow: hidden;
  }
  .card img {
    position: absolute;
    pointer-events: none;
  }
  .card b {
    position: absolute;
    left: 20px;
    top: 76px;
    font-family: Tektur, sans-serif;
    font-size: 40px;
    line-height: 0.9;
    letter-spacing: -0.4px;
    text-transform: uppercase;
    color: #fff;
  }
  .card span {
    position: absolute;
    left: 23px;
    top: 112px;
    font-size: 14px;
    line-height: 1.3;
    color: #fff;
    opacity: 0.6;
    white-space: nowrap;
  }
  .card.left {
    left: 0;
    top: 0;
    transform: rotate(15deg);
    background: rgba(255,255,255,0.1);
  }
  .card.left img { left: 10px; top: -123px; width: 269px; height: 269px; transform: rotate(-164.53deg) scaleY(-1); }
  .card.left b, .card.left span { mix-blend-mode: difference; }
  .card.mid {
    left: 240px;
    top: 59px;
    background: #323843;
  }
  .card.mid img.blur { left: -83px; top: -197px; width: 401px; height: 401px; filter: blur(25px); opacity: 0.6; }
  .card.mid img.fg { left: -12px; top: -140px; width: 294px; height: 294px; transform: rotate(-165deg) scaleY(-1); }
  .card.mid b, .card.mid span { color: #e6eff8; }
  .card.right {
    right: 0;
    top: 0;
    transform: rotate(-15deg);
    background: rgba(255,255,255,0.1);
  }
  .card.right img { left: -61px; top: -249px; width: 428px; height: 428px; transform: rotate(16.4deg) scaleY(-1); }
  .card.right b, .card.right span { mix-blend-mode: difference; }

  .card { transition: transform 0.35s cubic-bezier(0.22,1,0.36,1); }
  .card.left:hover { transform: rotate(15deg) translateY(-6px); }
  .card.mid:hover { transform: translateY(-6px); }
  .card.right:hover { transform: rotate(-15deg) translateY(-6px); }

  @media (prefers-reduced-motion: no-preference) {
    .headline { animation: fadeUp 1s cubic-bezier(0.22,1,0.36,1) 0.2s both; }
    .aside { animation: fadeUp 1s cubic-bezier(0.22,1,0.36,1) 0.4s both; }
    .cards { animation: fadeUp 1s cubic-bezier(0.22,1,0.36,1) 0.7s both; }
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="viewport">
  <div class="stage" id="stage">
    <video class="scene" src="assets/hero-video.mp4" poster="assets/scene.png" autoplay muted loop playsinline></video>
    <a class="logo" href="#"><img src="assets/logo.png" alt="Logo"></a>
    <nav>
      <a class="active" href="#">Overview</a>
      <a href="#">Experience</a>
      <a href="#">Technology</a>
      <a href="#">Ecosystem</a>
    </nav>
    <a class="preorder" href="#">Pre Order <span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></span></a>

    <h1 class="headline">
      <span>See</span>
      <span>Beyond</span>
      <span>Every</span>
      <span>Digital</span>
      <span>Screen</span>
    </h1>

    <div class="aside">
      <h2>Spatial Computing</h2>
      <p>Interact with apps, media, and tools directly within your physical environment.</p>
    </div>

    <div class="cards">
      <div class="card left">
        <img src="assets/card-visor.png" alt="">
        <b>1b</b>
        <span>Pixel Density</span>
      </div>
      <div class="card mid">
        <img class="blur" src="assets/card-inner-blur.png" alt="">
        <img class="fg" src="assets/card-inner.png" alt="">
        <b>1ms</b>
        <span>Motion Accuracy</span>
      </div>
      <div class="card right">
        <img src="assets/card-mesh.png" alt="">
        <b>92%</b>
        <span>Light Transparency</span>
      </div>
    </div>
  </div>
</div>
<script>
  (function () {
    var stage = document.getElementById('stage');
    var viewport = stage.parentElement;
    function fit() {
      var width = window.innerWidth || 1440;
      var scale = Math.min(1, width / 1440);
      stage.style.transform = 'scale(' + scale + ')';
      viewport.style.height = (810 * scale) + 'px';
    }
    window.addEventListener('resize', fit);
    fit();
  })();
</script>
</body>
</html>
