<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProGravity — Daily Hero 13 (Figma export)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Nuosu+SIL&family=Unbounded:wght@500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; font-family: Montserrat, sans-serif; }
  .viewport { overflow: hidden; }
  .stage {
    position: relative;
    width: 1440px;
    height: 810px;
    overflow: hidden;
    transform-origin: top left;
    background: #99badf;
  }
  .stage img { display: block; }
  a { text-decoration: none; color: inherit; }

  .bg { position: absolute; left: 0; bottom: 0; width: 1440px; height: 835px; }
  .bg img { width: 100%; height: 100%; object-fit: cover; }
  .overlay {
    position: absolute;
    left: -252px; top: -217px;
    width: 1832px; height: 1027px;
    mix-blend-mode: color-dodge;
    opacity: 0.2;
    pointer-events: none;
  }
  .overlay img { width: 100%; height: 100%; object-fit: cover; }

  .glow { position: absolute; pointer-events: none; }
  .glow.a { left: -308px; top: 306px; width: 1062px; height: 717px; }
  .glow.b { left: 771px; top: 336px; width: 1062px; height: 717px; }
  .glow.c { left: 11px; top: 475px; width: 1419px; height: 649px; }
  .glow img { width: 100%; height: 100%; }

  .shadow-a { position: absolute; left: 239px; top: 743px; width: 754px; height: 42px; }
  .shadow-b { position: absolute; left: 471px; top: 767px; width: 270px; height: 8px; }
  .shadow-a img, .shadow-b img { width: 100%; height: 100%; }

  .word {
    position: absolute;
    font-family: Unbounded, sans-serif;
    font-weight: 500;
    font-size: 162px;
    line-height: 1.2;
    letter-spacing: -6.47px;
    text-transform: uppercase;
    color: #fff;
    white-space: nowrap;
    pointer-events: none;
  }
  .word.gravi { left: 98px; top: 357px; filter: blur(24.8px); }
  .word.ty { left: 912px; top: 357px; }
  .word.pr { left: 31px; top: 226px; }
  .bar { position: absolute; left: 694px; top: 357px; width: 269px; height: 22px; background: #fff; }
  .pill {
    position: absolute;
    left: 361px; top: 224px;
    width: 549px; height: 116px;
    border: 21px solid #fff;
    border-radius: 55px;
    pointer-events: none;
  }

  .dancer {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 542px;
    height: 715px;
    object-fit: contain;
    object-position: bottom;
    pointer-events: none;
    z-index: 3;
  }
  .dancer-top {
    position: absolute;
    left: 449px;
    top: 57px;
    width: 542px;
    height: 260px;
    object-fit: contain;
    object-position: bottom;
    pointer-events: none;
    z-index: 4;
  }

  .brand {
    position: absolute;
    left: 29px;
    top: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 6;
  }
  .brand img { width: 36px; height: 31px; mix-blend-mode: screen; object-fit: cover; }
  .brand span {
    font-family: 'Nuosu SIL', serif;
    font-size: 12px;
    letter-spacing: 0.96px;
    text-transform: uppercase;
    color: #fff;
  }

  nav {
    position: absolute;
    left: 50%;
    top: 26px;
    transform: translateX(-50%);
    display: flex;
    gap: 60px;
    color: #fff;
    font-size: 12px;
    text-transform: capitalize;
    white-space: nowrap;
    z-index: 6;
  }
  nav a { opacity: 0.7; }
  nav a.active { opacity: 1; font-weight: 700; }

  .socials {
    position: absolute;
    left: 1254px;
    top: 16px;
    display: flex;
    gap: 17px;
    z-index: 6;
  }
  .socials a {
    position: relative;
    width: 38px;
    height: 38px;
    border: 1px solid rgba(255,255,255,0.29);
    border-radius: 999px;
  }
  .ico { position: absolute; left: 9px; top: 9px; width: 20px; height: 20px; }
  .ico img { position: absolute; }

  .tag {
    position: absolute;
    left: 955px;
    top: 248px;
    display: flex;
    align-items: center;
    gap: 24px;
    color: #fff;
    font-weight: 600;
    font-size: 24px;
    line-height: 1.4;
    text-transform: uppercase;
    z-index: 5;
  }
  .tag .slash { width: 18px; height: 47px; }
  .tag .slash img { width: 50px; height: 1px; transform: rotate(-69deg); }

  .lede {
    position: absolute;
    left: 114px;
    top: 525px;
    width: 342px;
    color: #fff;
    font-weight: 500;
    font-size: 16px;
    line-height: 1.4;
    z-index: 5;
  }

  .ctas {
    position: absolute;
    left: 110px;
    top: 626px;
    display: flex;
    align-items: center;
    z-index: 5;
  }
  .ctas .join {
    padding: 20px 32px;
    background: #fff;
    color: #025b86;
    font-weight: 700;
    font-size: 16px;
    border-radius: 9999px;
  }
  .ctas .classes {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 20px 32px;
    color: #fff;
    font-weight: 700;
    font-size: 16px;
  }
  .ctas .classes .circ {
    position: relative;
    width: 38px;
    height: 38px;
    border: 1px solid rgba(255,255,255,0.29);
    border-radius: 999px;
  }

  .stat {
    position: absolute;
    top: 551px;
    width: 290px;
    height: 125px;
    background: rgba(255,255,255,0.19);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    overflow: hidden;
    z-index: 5;
  }
  .stat.a { left: 814px; }
  .stat.b { left: 1112px; }
  .stat .n {
    position: absolute;
    font-family: Unbounded, sans-serif;
    font-size: 40px;
    letter-spacing: -1.6px;
    text-transform: uppercase;
    color: #fff;
  }
  .stat .l {
    position: absolute;
    color: #fff;
    opacity: 0.6;
    font-weight: 500;
    font-size: 16px;
    white-space: nowrap;
  }
  .stat.a .n { left: 129px; top: 37px; }
  .stat.a .l { left: 135px; top: 76px; }
  .stat.b .n { left: 80px; top: 37px; }
  .stat.b .l { left: 86px; top: 76px; }
  .stat .sun { position: absolute; left: 8px; top: 6px; width: 113px; height: 113px; }
  .stat .radio {
    position: absolute;
    left: 19px;
    top: 18px;
    width: 94px;
    height: 94px;
    transform: rotate(-30deg);
  }
  .av {
    position: absolute;
    width: 29px;
    height: 29px;
    border-radius: 99px;
    object-fit: cover;
  }

  .join, .stat { transition: transform 0.35s cubic-bezier(0.22,1,0.36,1); }
  .join:hover, .stat:hover { transform: translateY(-3px); }

  @media (prefers-reduced-motion: no-preference) {
    .word.pr, .word.gravi, .word.ty { animation: fadeUp 1.1s cubic-bezier(0.22,1,0.36,1) 0.15s both; }
    .dancer, .dancer-top { animation: fadeUp 1.2s cubic-bezier(0.22,1,0.36,1) 0.25s both; }
    .stat { animation: fadeUp 1s cubic-bezier(0.22,1,0.36,1) 0.6s both; }
  }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
</style>

<script>
  (function () {
    var stage = document.getElementById('stage');
    var viewport = stage.parentElement;
    function fit() {
      var width = window.innerWidth || 1440;
      var scale = Math.min(1, width / 1440);
      stage.style.transform = 'scale(' + scale + ')';
      viewport.style.height = (810 * scale) + 'px';
    }
    window.addEventListener('resize', fit);
    fit();
  })();
</script>
