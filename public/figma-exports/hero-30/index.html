<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniFokal — Daily Hero 30 (Figma export)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Funnel+Display:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; font-family: 'Funnel Display', sans-serif; }
  .viewport { overflow: hidden; }
  .stage {
    position: relative;
    width: 1440px;
    height: 810px;
    overflow: hidden;
    transform-origin: top left;
    background: #031113;
  }
  .stage img { display: block; }
  a { text-decoration: none; color: inherit; }

  .bg {
    position: absolute;
    left: -37px; top: -102px;
    width: 1780px; height: 2411px;
  }
  .bg img { width: 100%; height: 100%; object-fit: cover; }
  .glow {
    position: absolute;
    left: 447px; top: -328px;
    width: 1296px; height: 690px;
    pointer-events: none;
  }
  .fade-b {
    position: absolute;
    left: 0; bottom: 0;
    width: 1440px; height: 297px;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(44,44,44,0.3) 100%);
    pointer-events: none;
  }
  .fade-l {
    position: absolute;
    left: 0; top: 0;
    width: 446px; height: 810px;
    background: linear-gradient(90deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0) 100%);
    pointer-events: none;
  }

  .menu {
    position: absolute;
    left: 30px; top: 41px;
    width: 30px; height: 13px;
  }
  .star {
    position: absolute;
    left: 160px; top: 15px;
    width: 64px; height: 64px;
  }
  nav {
    position: absolute;
    left: 862px; top: 38px;
    display: flex;
    gap: 60px;
    font-size: 14px;
    letter-spacing: 3.08px;
    text-transform: uppercase;
    color: #fff;
  }
  .bag {
    position: absolute;
    left: 1348px; top: 31px;
    width: 32px; height: 32px;
  }
  .bag img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .badge {
    position: absolute;
    left: 1380px; top: 26px;
    width: 7px; height: 7px;
  }

  .rail {
    position: absolute;
    left: 89px; top: 0;
    width: 1px; height: 812px;
    background: rgba(255,255,255,0.35);
  }
  .side-a, .side-b {
    position: absolute;
    left: 37px;
    color: #fff;
    font-size: 12px;
    letter-spacing: 2.64px;
    text-transform: uppercase;
    opacity: 0.6;
    white-space: nowrap;
    transform: rotate(90deg);
    transform-origin: left top;
  }
  .side-a { top: 182px; }
  .side-b { top: 354px; }

  .headline {
    position: absolute;
    left: 169px; top: 179px;
    width: 381px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 64px;
    line-height: 0.9;
    text-transform: uppercase;
    color: #fff;
    text-align: right;
  }
  .h-arrow {
    position: absolute;
    left: 260px; top: 321px;
    width: 41px; height: 41px;
  }
  .lead {
    position: absolute;
    left: 170px; top: 408px;
    width: 204px;
    font-size: 14px;
    line-height: 1.4;
    color: #fff;
  }
  .cta {
    position: absolute;
    left: 411px; top: 409px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: #fff;
    color: #000;
    padding: 20px;
    font-size: 14px;
  }
  .cta img { width: 15px; height: 11px; }

  .word {
    position: absolute;
    left: 4px; top: 604px;
    width: 1433px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 295px;
    letter-spacing: 6px;
    line-height: 0.7;
    text-transform: uppercase;
    color: #fff;
    text-align: center;
    white-space: nowrap;
    pointer-events: none;
  }

  .card {
    position: absolute;
    left: 1094px; top: 468px;
    width: 293px; height: 297px;
    border: 1px solid rgba(255,255,255,0.2);
    background: linear-gradient(140deg, rgba(211,118,95,0.77) 9%, rgba(211,151,95,0.02) 86%);
    backdrop-filter: blur(40px);
    color: #fff;
  }
  .card .thumb {
    position: absolute;
    left: 30px; top: 27px;
    width: 73px; height: 73px;
    border-radius: 50%;
    object-fit: cover;
  }
  .card .arr {
    position: absolute;
    right: 17px; top: 15px;
    width: 55px; height: 55px;
  }
  .card p {
    position: absolute;
    left: 30px; top: 158px;
    width: 197px;
    font-weight: 300;
    font-size: 32px;
    letter-spacing: -0.32px;
    line-height: 1;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="viewport">
  <div class="stage" id="stage">
    <div class="bg"><img src="assets/eye.png" alt=""></div>
    <img class="glow" src="assets/star-glow.svg" alt="">
    <div class="fade-b"></div>
    <div class="fade-l"></div>

    <img class="menu" src="assets/menu.svg" alt="">
    <img class="star" src="assets/star.svg" alt="">
    <nav>
      <a href="#">Collections</a>
      <a href="#">Press</a>
      <a href="#">Contact</a>
    </nav>
    <div class="bag">
      <img src="assets/bag.svg" alt="">
      <img src="assets/bag-handle.svg" alt="">
    </div>
    <img class="badge" src="assets/dot.svg" alt="">

    <div class="rail"></div>
    <div class="side-a">876-654-567</div>
    <div class="side-b">info@fokal.com</div>

    <h1 class="headline">Perspective Shapes Our Reality</h1>
    <img class="h-arrow" src="assets/headline-arrow.svg" alt="">
    <p class="lead">Unlock your potential with our innovative solutions designed for your unique challenges</p>
    <a class="cta" href="#">Get Started <img src="assets/cta-arrow.svg" alt=""></a>

    <div class="word">UniFokal</div>

    <div class="card">
      <img class="thumb" src="assets/eye-thumb.png" alt="">
      <img class="arr" src="assets/card-arrow.svg" alt="">
      <p>Ambiguity is a point of view</p>
    </div>
  </div>
</div>
<script>
  (function () {
    var stage = document.getElementById('stage');
    var viewport = stage.parentElement;
    function fit() {
      var width = window.innerWidth || 1440;
      var scale = Math.min(1, width / 1440);
      stage.style.transform = 'scale(' + scale + ')';
      viewport.style.height = (810 * scale) + 'px';
    }
    window.addEventListener('resize', fit);
    fit();
  })();
</script>
</body>
</html>
