; SiteForge — Supervisor (Horizon + scheduler)
; Installed by deploy/bootstrap-vps.sh → /etc/supervisor/conf.d/siteforge.conf
; Placeholders: APP_BASE, DEPLOY_USER, PHP_BIN

[program:siteforge-horizon]
process_name=%(program_name)s
command=PHP_BIN artisan horizon
directory=APP_BASE
user=DEPLOY_USER
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/siteforge-horizon.log
stopwaitsecs=3600

[program:siteforge-scheduler]
process_name=%(program_name)s
command=PHP_BIN artisan schedule:work
directory=APP_BASE
user=DEPLOY_USER
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/siteforge-scheduler.log
