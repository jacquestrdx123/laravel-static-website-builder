; SiteForge — Supervisor programs (Horizon + scheduler)
; Installed by deploy/provision.sh -> /etc/supervisor/conf.d/siteforge.conf
; Placeholders: APP_BASE (resolves to /var/www/builder/current), DEPLOY_USER, PHP_BIN
;
; Both programs run out of the `current` symlink, so deploy.sh only has to
; restart them for a new release to take effect.

[program:siteforge-horizon]
process_name=%(program_name)s
command=PHP_BIN artisan horizon
directory=APP_BASE
user=DEPLOY_USER
; Poster/newsletter jobs run browsershot from the queue, so the workers need
; the same node + Chrome environment as the web tier.
environment=NODE_PATH="/usr/lib/node_modules",PUPPETEER_CACHE_DIR="/usr/lib/node_modules/.puppeteer-cache"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/siteforge-horizon.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
; Horizon traps SIGTERM and finishes the job in flight before exiting.
stopsignal=TERM
stopwaitsecs=3600
stopasgroup=true
killasgroup=true

[program:siteforge-scheduler]
process_name=%(program_name)s
command=PHP_BIN artisan schedule:work
directory=APP_BASE
user=DEPLOY_USER
; Poster/newsletter jobs run browsershot from the queue, so the workers need
; the same node + Chrome environment as the web tier.
environment=NODE_PATH="/usr/lib/node_modules",PUPPETEER_CACHE_DIR="/usr/lib/node_modules/.puppeteer-cache"
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/siteforge-scheduler.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
