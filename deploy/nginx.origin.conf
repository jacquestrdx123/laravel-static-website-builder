# SiteForge — Nginx HTTP origin (localhost only).
#
# Listens on 127.0.0.1:8080. Public TLS is terminated by Caddy
# (deploy/caddy.edge.Caddyfile), which reverse_proxies here.
#
# Replace placeholders before install:
#   APP_HOST      e.g. app.example.com
#   SITES_DOMAIN  e.g. sites.example.com  (must match Laravel SITES_DOMAIN)
#   PHP_FPM_SOCK  e.g. /run/php/php8.3-fpm.sock
#   APP_ROOT      e.g. /var/www/builder/current/public
#   SITES_ROOT    e.g. /srv/websites
#
# Install:
#   sudo cp deploy/nginx.origin.conf /etc/nginx/sites-available/siteforge-origin
#   sudo ln -sf /etc/nginx/sites-available/siteforge-origin /etc/nginx/sites-enabled/
#   # disable default site if it conflicts
#   sudo nginx -t && sudo systemctl reload nginx

# ---------------------------------------------------------------------------
# Loopback — Caddy on_demand_tls ask + local health checks
# Host is 127.0.0.1 when Caddy calls ask http://127.0.0.1:8080/caddy/allowed
# ---------------------------------------------------------------------------
server {
    listen 127.0.0.1:8080;
    server_name 127.0.0.1 localhost;

    root APP_ROOT;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /caddy/allowed {
        include fastcgi_params;
        fastcgi_pass unix:PHP_FPM_SOCK;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:PHP_FPM_SOCK;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }
}

# ---------------------------------------------------------------------------
# Builder application
# ---------------------------------------------------------------------------
server {
    listen 127.0.0.1:8080;
    server_name APP_HOST;

    root APP_ROOT;
    index index.php;

    client_max_body_size 64M;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:PHP_FPM_SOCK;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}

# ---------------------------------------------------------------------------
# Free customer hosts: {slug}.SITES_DOMAIN
# ---------------------------------------------------------------------------
server {
    listen 127.0.0.1:8080;
    server_name ~^(?<slug>[a-z0-9-]+)\.SITES_DOMAIN$;

    root SITES_ROOT/$slug;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.html =404;
    }

    location ~ /\. {
        deny all;
    }
}

# ---------------------------------------------------------------------------
# Custom domains — Host maps to SITES_ROOT/domains/$host (symlink)
# default_server so unknown Hosts land here (Caddy only proxies allowed names)
# ---------------------------------------------------------------------------
server {
    listen 127.0.0.1:8080 default_server;
    server_name _;

    # PublishedSiteHost stores the linked hostname exactly (including www or not).
    root SITES_ROOT/domains/$host;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.html =404;
    }

    location ~ /\. {
        deny all;
    }
}
