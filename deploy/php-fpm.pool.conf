; SiteForge — dedicated PHP-FPM pool.
; Installed by deploy/provision.sh -> /etc/php/PHP_VERSION/fpm/pool.d/siteforge.conf
; Placeholders: PHP_VERSION, DEPLOY_USER
;
; Runs as the deploy user so PHP can write published sites into SITES_ROOT
; without group-permission gymnastics. Nginx runs as the same user.

[siteforge]

user = DEPLOY_USER
group = DEPLOY_USER

listen = /run/php/siteforge.sock
listen.owner = DEPLOY_USER
listen.group = DEPLOY_USER
listen.mode = 0660

; 4 GB box, 2 vCPU. Each PHP worker for this app sits around 80-120 MB.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Long-running AI generation requests come through the queue, not the web
; tier, so the web timeout stays modest.
request_terminate_timeout = 120s

php_admin_value[error_log] = /var/log/php/siteforge-fpm-error.log
php_admin_flag[log_errors] = on

php_admin_value[memory_limit] = 512M
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[max_execution_time] = 120

; Browsershot shells out to node. puppeteer is installed globally, and its
; bundled Chrome lives in the global cache — without PUPPETEER_CACHE_DIR it
; would look in ~/.cache/puppeteer and fail to find a browser at render time.
env[PATH] = /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
env[NODE_PATH] = /usr/lib/node_modules
env[PUPPETEER_CACHE_DIR] = /usr/lib/node_modules/.puppeteer-cache
